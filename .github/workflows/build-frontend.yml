name: Build React Frontend (frontend/dist)

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/src/**'
      - 'frontend/index.html'
      - 'frontend/package.json'
      - 'frontend/vite.config.js'
      - '.github/workflows/build-frontend.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies and build React frontend
        run: |
          cd frontend
          npm install
          npm run build
          cd ..

      - name: Commit built frontend/dist to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f frontend/dist
          if ! git diff --staged --quiet; then
            git commit -m "chore: build React frontend static assets [skip ci]"
            git push
          else
            echo "No changes in frontend/dist"
          fi
